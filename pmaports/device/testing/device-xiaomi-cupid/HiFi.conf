# Volume and channel plumbing as alsa-lib PCMs (alsa-lib prefixes the PCM
# names below with this card's private UCM configuration):
# (SubstiConfig: ${CardId} is expanded.)
# - none of the codec controls on the speaker or headphone path is a
#   usable master volume, and without a PlaybackMixerElem PulseAudio sets
#   its volume on an empty mixer path (the slider does nothing); softvol
#   gives each output a dB volume control. The speaker one tops out at
#   -10 dB: there is no speaker protection, and full scale with the
#   amplifiers at their lowest gain already sounded overdriven.
# - the MultiMedia3 capture PCM only opens with two channels, the
#   microphone is on the first: route makes it a mono source, with a
#   softvol capture volume.
LibraryConfig.cupid.SubstiConfig {
	pcm.cupid_speaker {
		type softvol
		slave.pcm "hw:${CardId},0"
		control {
			name "Speaker Playback Volume"
			card "${CardId}"
		}
		min_dB -60.0
		max_dB -10.0
		resolution 256
	}
	pcm.cupid_headphone {
		type softvol
		slave.pcm "hw:${CardId},0"
		control {
			name "Headphone Playback Volume"
			card "${CardId}"
		}
		min_dB -60.0
		max_dB 0.0
		resolution 256
	}
	pcm.cupid_mic_mono {
		type route
		slave {
			pcm "hw:${CardId},2"
			channels 2
		}
		ttable.0.0 1.0
	}
	pcm.cupid_mic {
		type softvol
		slave.pcm "cupid_mic_mono"
		control {
			name "Mic Capture Volume"
			card "${CardId}"
		}
		min_dB -30.0
		max_dB 0.0
		resolution 256
	}
}

SectionVerb {
	# Start from a known routing: alsa-restore brings back whatever was
	# routed at shutdown, and one stream routed to both the headphone and
	# the speaker backend makes the DSP refuse the graph ("DSP returned
	# error[1001000]"), so PulseAudio found no working profile.
	EnableSequence [
		cset "name='TERTIARY_TDM_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='TERTIARY_TDM_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones Playback"
	Include.wcdhpe.File "/codecs/wcd938x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd938x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"
	ConflictingDevice [
		"Speaker"
	]
	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "cupid_headphone"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "Headphone"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"
	# The two CS35L41 amplifiers on tertiary TDM. Same PCM as the
	# headphones (MultiMedia1): the verb routes it to the headphone path,
	# so PulseAudio can open it while probing; this device moves the route
	# to the TDM backend and back. The amplifiers play the ASP input (their
	# DSP needs firmware not loaded). No speaker protection: the amplifier
	# gain is held at its lowest step, 0.5 dB (Analog PCM Volume 0 of 20).
	ConflictingDevice [
		"Headphones"
	]
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='SpkrLeft PCM Source' ASP"
		cset "name='SpkrRight PCM Source' ASP"
		cset "name='SpkrLeft Analog PCM Volume' 0"
		cset "name='SpkrRight Analog PCM Volume' 0"
		cset "name='TERTIARY_TDM_RX_0 Audio Mixer MultiMedia1' 1"
	]
	DisableSequence [
		cset "name='TERTIARY_TDM_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
	]
	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "cupid_speaker"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "Speaker"
	}
}

SectionDevice."Mic1" {
	Comment "Top Microphone"
	Include.wcdmice.File "/codecs/wcd938x/AnalogMic1EnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd938x/AnalogMic1DisableSeq.conf"
	Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/SoundwireMic0EnableSeq.conf"
	Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"
	Value {
		# Mono from the stereo MultiMedia3 PCM, see cupid_mic above.
		CaptureChannels 1
		CapturePriority 200
		CapturePCM "cupid_mic"
		CaptureMixer "default:${CardId}"
		CaptureMixerElem "Mic"
	}
}
