# cupid is 1080x2400 on a roughly 70x155 mm panel, about 420 dpi. Unscaled,
# Phosh renders far too small to use. Integer scale 3 gives 360x800 logical
# pixels (the usual phone layout) and avoids fractional-scale blur. Phosh
# does not save a scale chosen in Settings across logins; this file sets it.
[cursor:seat0]
map-to-output = DSI-1

[output:DSI-1]
scale = 3
