# Voice calls (VoLTE) on the Xiaomi 12.
#
# The call audio never passes through Linux: the modem exchanges voice
# packets with the ADSP, and the ADSP's voice graphs connect to the speaker
# and microphone backends of this card's topology. "Voice Call Switch" (kernel
# patch 0042) starts those graphs, from the command file that
# cupid-voice-firmware.service generates out of the stock calibration, once
# both backends run: the tertiary TDM (amplifiers) and codec DMA TX3 (handset
# microphone). A Linux playback and capture stream keep them running, which
# PulseAudio does during a call (soc-qcom's call_audio_idle_suspend_workaround
# unloads module-suspend-on-idle). callaudiod switches the card to this verb
# when a call starts.
#
# Handset only: the generated command set is stock's handset graph
# (earpiece, handset microphone, echo cancellation tuned for them). No
# speakerphone yet: it needs stock's speaker graph and calibration, and
# PulseAudio 17 puts devices sharing a PCM into separate profiles, while
# callaudiod's speaker toggle only switches ports within one sink.

SectionVerb {
	# The playback PCM stays routed to the amplifiers for the whole call.
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='TERTIARY_TDM_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='SpkrLeft PCM Source' ASP"
		cset "name='SpkrRight PCM Source' ASP"
		cset "name='SpkrLeft Analog PCM Volume' 0"
		cset "name='SpkrRight Analog PCM Volume' 0"
		cset "name='SpkrRight Digital PCM Volume' 0"
		cset "name='SpkrLeft Digital PCM Volume' 817"
		cset "name='TERTIARY_TDM_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='Voice Call Switch' 1"
	]
	DisableSequence [
		cset "name='Voice Call Switch' 0"
		cset "name='TERTIARY_TDM_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
	]
	Value {
		TQ "Voice"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"
	# Stock uses the top amplifier (0x42, SpkrLeft) as the earpiece; the verb
	# mutes the bottom one. Amplifier gain at its lowest step as for the
	# speakers (stock runs the earpiece at a higher one), 0 dB digital.
	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic1" {
	Comment "Top Microphone"
	Include.wcdmice.File "/codecs/wcd938x/AnalogMic1EnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd938x/AnalogMic1DisableSeq.conf"
	Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/SoundwireMic0EnableSeq.conf"
	Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"
	Value {
		CaptureChannels 1
		CapturePriority 200
		CapturePCM "cupid_mic"
	}
}
