# Sony IMX766, Xiaomi 12 main camera (semco module).
# Generated from the stock Chromatix tuning (com.qti.tuned.cupid_semco_imx766_wide):
# AWB colour temperature curve from the refPtV1 white points,
# colour matrices from cc13_ipe_v2 for CCT regions 2650-3350, 3600-4400, 4700-5300, 5800-10000 K,
# lens shading from lsc41 (2400-3200, 3800-4300, 4800-6000 K regions, R/Gr/Gb/B 17x13 resampled
# to 17x17, G = (Gr + Gb) / 2, R and B scaled so the table keeps the
# frame-average colour, as AWB statistics are taken before shading
# correction). Tabular Lsc values are stored quantised as UQ<2,6>
# (64 = 1.0, max 255).
%YAML 1.1
